name: Check Stock
on:
  schedule:
    - cron: "*/10 * * * *"  # 每 10 分钟运行一次
  workflow_dispatch:

jobs:
  check_stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock checker (Selenium)
        env:
          STOCK_URL: ${{ secrets.STOCK_URL }}        # 目标产品页面 URL
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}    # 接收通知的邮箱
          SMTP_HOST: ${{ secrets.SMTP_HOST }}          # 邮件服务器（例如 smtp.qq.com）
          SMTP_PORT: ${{ secrets.SMTP_PORT }}          # 邮件服务器端口（例如 465）
          SMTP_USER: ${{ secrets.SMTP_USER }}          # 发件人邮箱（例如 2844164110@qq.com）
          SMTP_PASS: ${{ secrets.SMTP_PASS }}          # 授权码（例如 slvnhakgybqudfii）
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}    # 发件人邮箱（默认为 SMTP_USER）
        run: python check_stock.py
